name: release-please

on:
  push:
    branches:
      - main

# release-please only opens and maintains the release PR (version bumps +
# CHANGELOG.md). Tagging and the artifact build stay manual: the tag push
# triggers release.yml, matching the documented release flow.
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
